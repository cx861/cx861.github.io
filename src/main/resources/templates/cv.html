<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的简历</title>
    <style>
        /* 简单美化页面 */
        body {
            font-family: "Microsoft Yahei", sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .resume-img {
            max-width: 100%;
            height: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .back-home {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 16px;
            color: #007bff;
            text-decoration: none;
            border: 1px solid #007bff;
            border-radius: 4px;
        }
        .back-home:hover {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>
<h1>我的简历</h1>
<!-- 直接引用简历图片 -->
<img src="/resume.png" alt="我的简历" class="resume-img">
<br>
<a href="/" class="back-home">回到首页</a>
</body>
</html>
