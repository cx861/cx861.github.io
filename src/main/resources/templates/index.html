<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的首页</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 页面背景 - 纹理+抽象几何+渐变，丰富但不杂乱 */
        body {
            font-family: "PingFang SC", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px 20px;
            /* 核心：多层背景叠加（纹理+几何图形+渐变） */
            background:
                /* 细微纹理（增加质感） */
                    url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%239C92AC' fill-opacity='0.06' fill-rule='evenodd'/%3E%3C/svg%3E"),
                        /* 抽象几何图形（低透明度，不抢焦点） */
                    radial-gradient(circle at 20% 30%, rgba(66, 153, 225, 0.08) 0%, transparent 40%),
                    radial-gradient(circle at 80% 70%, rgba(159, 122, 234, 0.08) 0%, transparent 40%),
                        /* 基础渐变 */
                    linear-gradient(135deg, #f0f4f8 0%, #e8eef2 100%);
            /* 背景固定，滚动时不位移 */
            background-attachment: fixed;
        }

        /* 主容器 - 不对称布局 */
        .main-wrapper {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 60px;
            /* 半透明背景层，让内容和背景区分开 */
            backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.6);
        }

        /* 标题区域 - 手写体+个性排版 */
        .title-section {
            position: relative;
            padding-left: 20px;
            border-left: 4px solid #2d3748;
        }

        .title-section h1 {
            font-family: "Ma Shan Zheng", cursive; /* 手写体，有个人特色 */
            font-size: 3.5rem;
            color: #2d3748;
            line-height: 1.2;
            letter-spacing: 2px;
            /* 文字阴影，增加层次感 */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
        }

        .title-section p {
            margin-top: 10px;
            color: #718096;
            font-size: 1.1rem;
            font-style: italic;
        }

        /* 链接区域 - 极简质感样式 */
        .links-section {
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding-left: 20px;
        }

        /* 自定义链接样式 - 非按钮化，更高级 */
        .custom-link {
            text-decoration: none;
            color: #2d3748;
            font-size: 1.2rem;
            position: relative;
            padding-bottom: 8px;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* 链接下划线动画 - 核心特色 */
        .custom-link::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #4299e1, #9f7aea); /* 渐变下划线 */
            transition: width 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* hover效果 - 下划线展开+文字变色 */
        .custom-link:hover {
            color: #4299e1;
            transform: translateX(8px);
        }

        .custom-link:hover::after {
            width: 100%;
        }

        /* 图标点缀 - 增加细节 */
        .custom-link::before {
            content: "→";
            position: absolute;
            left: -20px;
            top: 2px;
            color: #4299e1;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .custom-link:hover::before {
            opacity: 1;
            transform: translateX(4px);
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .title-section h1 {
                font-size: 2.5rem;
            }

            .custom-link {
                font-size: 1.1rem;
            }

            .main-wrapper {
                gap: 40px;
                backdrop-filter: blur(4px);
            }
        }

        /* 引入手写字体 */
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');
    </style>
</head>
<body>
<div class="main-wrapper">
    <!-- 标题区域 -->
    <div class="title-section">
        <h1>欢迎来到我的小站</h1>
        <p>一个简单的个人主页</p>
    </div>

    <!-- 链接区域 -->
    <div class="links-section">
        <a href="cv" class="custom-link">我的在线简历</a>
        <a href="https://gitee.com/cx861" target="_blank" rel="noopener noreferrer" class="custom-link">我的Gitee代码仓库</a>
    </div>
</div>
</body>
</html>
