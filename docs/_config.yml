title: cx861 的笔记
description: 个人学习笔记与技术博客
logo: /assets/logo.png
theme: jekyll-theme-minimal

markdown: kramdown
highlighter: rouge
permalink: /:title/

collections:
  docs:
    output: true
    permalink: /docs/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default

github:
  repository: https://github.com/cx861/cx861.github.io
  zip_url: https://github.com/cx861/cx861.github.io/archive/main.zip
  title: cx861
  subtitle: 学习笔记与技术分享

author:
  name: cx861
  bio: 全栈开发者 | 技术爱好者
  location: 中国

social:
  github: cx861
  email: cx861@example.com

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-relative-links

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .idea
  - .vscode